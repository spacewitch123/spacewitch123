<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <linearGradient id="dk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3410" stop-opacity=".1"/>
      <stop offset=".15" stop-color="#ff9a3c"/>
      <stop offset=".35" stop-color="#fff6e0"/>
      <stop offset=".55" stop-color="#ffd08a"/>
      <stop offset=".8" stop-color="#d9762a"/>
      <stop offset="1" stop-color="#7a3410" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0cc"/>
      <stop offset=".5" stop-color="#ffc070"/>
      <stop offset="1" stop-color="#c8641e"/>
    </linearGradient>
    <radialGradient id="hz">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#ff9a3c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="260">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bl" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="260">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <style>
    .st circle{fill:#fff;animation:tw 3s ease-in-out infinite}
    .st circle:nth-child(3n){animation-delay:1s}
    .st circle:nth-child(3n+1){animation-delay:2s;fill:#ffe9c4}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .pulse{transform-origin:400px 110px;animation:p 3.6s ease-in-out infinite}
    @keyframes p{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.035);opacity:1}}
    .haze{transform-origin:400px 110px;animation:h 3.6s ease-in-out infinite}
    @keyframes h{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
    .sb{stroke-dasharray:2 18;animation:sb 2.4s linear infinite}
    @keyframes sb{to{stroke-dashoffset:40}}
    .sf{stroke-dasharray:2 18;animation:sf 2.4s linear infinite}
    @keyframes sf{to{stroke-dashoffset:-40}}
    .name{font:500 26px 'Helvetica Neue',Arial,sans-serif;letter-spacing:10px;fill:#fff2d6}
    .sub{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#c9894a}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="800" height="260" rx="16" fill="#000"/>

  <g class="st">
    <circle cx="40" cy="30" r="1.1"/><circle cx="95" cy="200" r="0.9"/><circle cx="150" cy="60" r="1.4"/>
    <circle cx="210" cy="230" r="0.9"/><circle cx="250" cy="25" r="1.2"/><circle cx="300" cy="170" r="0.8"/>
    <circle cx="560" cy="35" r="1.3"/><circle cx="610" cy="190" r="1"/><circle cx="680" cy="50" r="0.9"/>
    <circle cx="740" cy="215" r="1.4"/><circle cx="770" cy="25" r="1"/><circle cx="20" cy="140" r="1.2"/>
    <circle cx="785" cy="130" r="0.9"/><circle cx="120" cy="120" r="0.8"/><circle cx="700" cy="160" r="1.1"/>
  </g>

  <circle class="haze" cx="400" cy="110" r="170" fill="url(#hz)"/>

  <g class="pulse">
    <g filter="url(#bl)" opacity=".75" fill="none" stroke="#ff9a3c">
      <path d="M334,110 A66,66 0 0 1 466,110" stroke-width="18"/>
      <path d="M100,110 A300,10 0 0 0 700,110" stroke-width="16"/>
      <path d="M100,110 A300,10 0 0 1 700,110" stroke-width="12"/>
    </g>
    <path d="M100,110 A300,10 0 0 1 700,110" fill="none" stroke="url(#dk)" stroke-width="7" opacity=".85" filter="url(#gl)"/>
    <path class="sb" d="M100,110 A300,10 0 0 1 700,110" fill="none" stroke="#fff" stroke-width="1.5" opacity=".45"/>
    <path d="M334,110 A66,66 0 0 1 466,110" fill="none" stroke="url(#ln)" stroke-width="12" filter="url(#gl)"/>
    <path d="M343,112 A57,54 0 0 0 457,112" fill="none" stroke="url(#ln)" stroke-width="4" opacity=".9" filter="url(#gl)"/>
    <circle cx="400" cy="110" r="51" fill="#000"/>
    <circle cx="400" cy="110" r="52.5" fill="none" stroke="#fff4dc" stroke-width="1.4" filter="url(#gl)"/>
    <path d="M100,110 A300,10 0 0 0 700,110" fill="none" stroke="url(#dk)" stroke-width="9" filter="url(#gl)"/>
    <path class="sf" d="M100,110 A300,10 0 0 0 700,110" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6"/>
  </g>

  <text x="400" y="208" text-anchor="middle" class="name">UMAIR KHYAM</text>
  <text x="400" y="236" text-anchor="middle" class="sub">full-stack developer · next.js · nestjs · typescript</text>
</svg>
