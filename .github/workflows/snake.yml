name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb99ff&color_dots=#161b22,#2d1f4e,#4b2f8a,#7a5cc7,#bb99ff
            dist/snake-light.svg?color_snake=#7a5cc7&color_dots=#ebedf0,#d9c8ff,#bb99ff,#7a5cc7,#4b2f8a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
