<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1c1236"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#e2d6ff"/>
      <stop offset="100%" stop-color="#5b3fa8"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bb99ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .stars circle{fill:#fff;animation:tw 3s ease-in-out infinite}
    .stars circle:nth-child(3n){animation-delay:1s}
    .stars circle:nth-child(3n+1){animation-delay:2s;fill:#d9c8ff}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .orbit{transform-origin:680px 100px;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .comet{animation:fly 7s ease-in infinite}
    @keyframes fly{0%{transform:translate(0,0);opacity:0}4%{opacity:1}28%{transform:translate(-420px,150px);opacity:0}100%{transform:translate(-420px,150px);opacity:0}}
    .title{font:700 38px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff}
    .sub{font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#bb99ff}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="800" height="200" rx="16" fill="url(#sky)"/>

  <g class="stars">
    <circle cx="40" cy="30" r="1.2"/><circle cx="95" cy="160" r="1"/>
    <circle cx="150" cy="60" r="1.6"/><circle cx="210" cy="175" r="1"/>
    <circle cx="260" cy="25" r="1.3"/><circle cx="320" cy="150" r="1"/>
    <circle cx="370" cy="40" r="1.7"/><circle cx="430" cy="180" r="1.1"/>
    <circle cx="470" cy="20" r="1"/><circle cx="520" cy="165" r="1.5"/>
    <circle cx="560" cy="45" r="1"/><circle cx="600" cy="185" r="1.2"/>
    <circle cx="610" cy="15" r="1.4"/><circle cx="760" cy="30" r="1"/>
    <circle cx="775" cy="170" r="1.6"/><circle cx="740" cy="120" r="1"/>
    <circle cx="20" cy="110" r="1.3"/><circle cx="500" cy="95" r="0.9"/>
  </g>

  <g class="comet">
    <line x1="700" y1="10" x2="760" y2="-12" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="700" cy="10" r="2.5" fill="#fff"/>
  </g>

  <ellipse cx="680" cy="100" rx="58" ry="12" fill="none" stroke="#bb99ff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="680" cy="100" r="34" fill="url(#planet)"/>
  <path d="M622 100 a58 12 0 0 0 116 0" fill="none" stroke="#bb99ff" stroke-opacity=".8" stroke-width="2"/>
  <g class="orbit"><circle cx="680" cy="38" r="5" fill="#e2d6ff"/></g>

  <text x="48" y="95" class="title">Umair Khyam<tspan class="cursor" fill="#bb99ff">_</tspan></text>
  <text x="50" y="128" class="sub">full-stack developer · next.js · nestjs · typescript</text>
</svg>
